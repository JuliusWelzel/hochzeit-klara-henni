<!doctype html>
<meta charset="utf-8">
<title>ticket-core Tests</title>
<pre id="out">läuft…</pre>
<script type="module">
  const out = document.getElementById('out');
  const results = [];
  const test = (name, fn) => {
    try { fn(); results.push(['PASS', name]); }
    catch (e) { results.push(['FAIL', name + ' — ' + e.message]); }
  };
  const eq = (a, b) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`erwartet ${JSON.stringify(b)}, bekam ${JSON.stringify(a)}`); };
  const ok = (c, m) => { if (!c) throw new Error(m || 'Bedingung falsch'); };

  try {
    const m = await import('../ticket-core.js');

    test('summarizeMeals zählt in fester Reihenfolge', () =>
      eq(m.summarizeMeals(['Vegan', 'Fleisch', 'Fleisch']), '2× Fleisch, 1× Vegan'));
    test('summarizeMeals mit allen drei', () =>
      eq(m.summarizeMeals(['Vegetarisch', 'Vegan', 'Fleisch']), '1× Fleisch, 1× Vegetarisch, 1× Vegan'));
    test('summarizeMeals leer', () => eq(m.summarizeMeals([]), ''));

    test('seatFor deterministisch', () => eq(m.seatFor('Klara'), m.seatFor('Klara')));
    test('seatFor Format', () => {
      for (const n of ['Klara', 'Henni', 'Julius Welzel', 'Ä', 'x'.repeat(80)]) {
        const s = m.seatFor(n);
        eq(s.block, 'K&H');
        ok(/^\d{2}$/.test(s.row) && +s.row >= 1 && +s.row <= 30, 'row ' + s.row);
        ok(/^\d{2}$/.test(s.seat) && +s.seat >= 1 && +s.seat <= 40, 'seat ' + s.seat);
      }
    });
    test('seatFor ignoriert Groß/Klein und Leerzeichen außen', () =>
      eq(m.seatFor('  klara '), m.seatFor('Klara')));

    test('slugify Umlaute', () => eq(m.slugify('Klara Müller'), 'klara-mueller'));
    test('slugify ä ö ß', () => eq(m.slugify('Jörg Gäßler'), 'joerg-gaessler'));
    test('slugify Sonderzeichen', () => eq(m.slugify('  Anna & Ben!! '), 'anna-ben'));
    test('slugify leer', () => eq(m.slugify('   '), 'gast'));

    test('buildIcs ganztägig am 05.11.2027', () => {
      const ics = m.buildIcs();
      ok(ics.includes('DTSTART;VALUE=DATE:20271105\r\n'), 'DTSTART');
      ok(ics.includes('DTEND;VALUE=DATE:20271106\r\n'), 'DTEND');
      ok(ics.includes('SUMMARY:Hochzeit Klara & Henni\r\n'), 'SUMMARY');
      ok(ics.includes('Kamisheide 50\\, 45133 Essen'), 'LOCATION escaped');
      ok(ics.startsWith('BEGIN:VCALENDAR\r\n') && ics.endsWith('END:VCALENDAR\r\n'), 'Rahmen');
      ok(!/[^\r]\n/.test(ics), 'nur CRLF');
    });
    const file = await fetch('../hochzeit-klara-henni.ics').then(r => r.ok ? r.text() : '(fehlt)');
    test('statische ICS-Datei entspricht buildIcs()', () => eq(file, m.buildIcs()));
  } catch (e) {
    results.push(['FAIL', 'Modul laden — ' + e.message]);
  }

  const failed = results.filter(r => r[0] === 'FAIL').length;
  out.textContent = results.map(r => r.join(' ')).join('\n') +
    `\n\n${results.length - failed}/${results.length} PASS`;
  document.title = failed ? 'FAIL' : 'PASS';
</script>
